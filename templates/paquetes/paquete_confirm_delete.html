{% extends "base.html" %}
{% block title %}Eliminar paquete{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card border-danger shadow-sm">
      <div class="card-body">
        <h1 class="h4 text-danger">¿Eliminar este paquete?</h1>
        <p>Vas a eliminar <strong>{{ object.nombre }}</strong> ({{ object.destino }}). Esta acción no se puede deshacer.</p>
        <form method="post">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger">Sí, eliminar</button>
          <a href="{% url 'paquete_list' %}" class="btn btn-outline-secondary">Cancelar</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
